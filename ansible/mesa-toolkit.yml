- name: Install MESA Tools
  shell: |
    cd {{ vm_tools_source_dir }}/github.com/cisagov/mesa-toolkit
    chmod +x mesa-install-tools.sh
    ./mesa-install-tools.sh -{{ system_platform }}
  args:
    creates: /opt/MESA-venv
  become: yes
  register: mesa_tools_install
  changed_when: mesa_tools_install.rc == 0

- name: Fix Ownership of Virtual Environment
  file:
    path: "/opt/MESA-venv"
    owner: "{{ vm_username }}"
    group: "{{ vm_username }}"
    recurse: yes
  become: yes
  when: mesa_tools_install is succeeded

- name: Install MESA GUI dependencies
  pip:
    name:
      - colorama
      - gunicorn
    virtualenv: /opt/MESA-venv
  become: yes
  become_user: "{{ vm_username }}"

- name: Install MESA GUI
  pip:
    name: .
    chdir: "{{ vm_tools_source_dir }}/github.com/cisagov/mesa-gui"
    virtualenv: /opt/MESA-venv
  become: yes
  become_user: "{{ vm_username }}"

- name: Generate SSL certificate for MESA GUI
  shell: |
    cd {{ vm_tools_source_dir }}/github.com/cisagov/mesa-gui/mesa_gui
    openssl req -x509 -newkey rsa:4096 -keyout key.pem -out cert.pem -days 365 -nodes \
      -subj "/C=US/ST=Virginia/L=Arlington/O=CISA/OU=NCATS/CN=mesa.local"
  args:
    creates: "{{ vm_tools_source_dir }}/github.com/cisagov/mesa-gui/mesa_gui/cert.pem"
  become: yes
  become_user: "{{ vm_username }}"

- name: Run Django migrations
  django_manage:
    command: migrate
    app_path: "{{ vm_tools_source_dir }}/github.com/cisagov/mesa-gui/mesa_gui"
    virtualenv: /opt/MESA-venv
  become: yes
  become_user: "{{ vm_username }}"

- name: Load MESA fixtures
  django_manage:
    command: loaddata
    app_path: "{{ vm_tools_source_dir }}/github.com/cisagov/mesa-gui/mesa_gui"
    fixtures: mesa/fixtures/mesajobs.json
    virtualenv: /opt/MESA-venv
  become: yes
  become_user: "{{ vm_username }}"

- name: Debug MESA user variables
  debug:
    msg: 
      - "MESA Username: {{ mesa_user_name }}"
      - "MESA Password length: {{ mesa_user_password | length }}"
  when: mesa_user_name is defined and mesa_user_password is defined

- name: Create Django superuser
  shell: |
    . /opt/MESA-venv/bin/activate
    cd {{ vm_tools_source_dir }}/github.com/cisagov/mesa-gui/mesa_gui
    export DJANGO_SUPERUSER_PASSWORD={{ mesa_user_password }}
    export DJANGO_SUPERUSER_EMAIL=vulnerability@cisa.dhs.gov
    python3 manage.py createsuperuser --username {{ mesa_user_name }} --no-input
  become: yes
  become_user: "{{ vm_username }}"

- name: Collect Django static files
  django_manage:
    command: collectstatic
    app_path: "{{ vm_tools_source_dir }}/github.com/cisagov/mesa-gui/mesa_gui"
    virtualenv: /opt/MESA-venv
  become: yes
  become_user: "{{ vm_username }}"

- name: Disable DEBUG Mode
  lineinfile:
    path: "{{ vm_tools_source_dir }}/github.com/cisagov/mesa-gui/mesa_gui/mesa_gui/settings.py"
    regexp: '^DEBUG ='
    line: 'DEBUG = False'

- name: Allow for all hosts
  lineinfile:
    path: "{{ vm_tools_source_dir }}/github.com/cisagov/mesa-gui/mesa_gui/mesa_gui/settings.py"
    regexp: '^ALLOWED_HOSTS ='
    line: 'ALLOWED_HOSTS = ["*"]'

- name: Install nginx
  become: yes
  ansible.builtin.package:
    name: nginx
    state: present
    update_cache: yes

- name: Copy nginx config file
  become: yes
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-enabled/default
    owner: root
    group: root
    mode: '0644'
    backup: yes
  notify: restart nginx

- name: Install MESA-Gui as a Service
  template:
    src: mesa.service.j2
    dest: /etc/systemd/system/mesa.service
    mode: '0644'
  become: yes
  notify: restart mesa

- name: Start and enable mesa service
  systemd:
    daemon_reload: yes
    name: mesa
    state: started
    enabled: yes
  become: yes

- name: Start and enable nginx service
  systemd:
    name: nginx
    state: started
    enabled: yes
  become: yes
